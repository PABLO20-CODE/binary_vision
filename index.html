<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Vision | Pablo Canché</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1931;color:#e8e8e8;font-family:'Inter',sans-serif;overflow-x:hidden}
#particles{position:fixed;inset:0;z-index:0;opacity:0.25}

/* HERO */
.hero{position:relative;z-index:1;min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.logo-bv{width:300px;max-width:75vw;animation:entrada 1.2s ease-out}
.logo-bv img{width:100%;filter:brightness(1.1)}
.tagline{margin-top:15px;letter-spacing:4px;font-size:0.85rem;color:#a8b8d0;text-transform:uppercase;font-weight:300}
.hero h1{display:none}

/* CONTACT SECTION - ESTILO BINARYVISION.IN ELEGANTE */
.contact{background:#0a1931;position:relative;z-index:1;padding:80px 25px;display:flex;flex-wrap:wrap;justify-content:center;gap:60px;align-items:center;border-top:1px solid rgba(255,255,255,0.08)}
.contact-left{min-width:300px;max-width:380px}
.contact-logo{width:200px;margin-bottom:10px;filter:brightness(1.2)}
.contact-sub{color:#8a9bb5;font-size:0.85rem;letter-spacing:1px;margin-top:5px}
.contact-left h2{font-family:'Playfair Display',serif;font-size:3.5rem;font-weight:300;margin-top:50px;color:#f5f5f5}
.contact-line{width:140px;height:1px;background:#5a6a80;margin:18px 0 40px}
.info-item{display:flex;gap:18px;margin:28px 0;align-items:center}
.info-icon{width:28px;height:28px;stroke:#8a9bb5;fill:none}
.info-item div{line-height:1.4}
.info-item small{color:#8a9bb5;font-size:0.9rem}
.info-item strong{color:#e0e0e0;font-weight:400;font-size:1.05rem}
.btn-msg{display:inline-block;margin-top:30px;padding:14px 38px;border:1px solid #6a7d96;color:#c0cfdf;text-decoration:none;font-size:0.95rem;letter-spacing:0.5px;transition:.3s}
.btn-msg:hover{background:rgba(255,255,255,0.05);border-color:#a0b0c8;color:white}

.contact-right{max-width:520px;width:100%;border:1px solid rgba(255,255,255,0.15);padding:10px;background:rgba(255,255,255,0.02)}
.contact-right img{width:100%;display:block;filter:contrast(1.05) brightness(1.02)}

@keyframes entrada{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:800px){.contact{padding:50px 20px}.contact-left h2{font-size:2.8rem}}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<div class="hero">
  <div class="logo-bv">
    <img src="logo.png" alt="Binary Vision">
  </div>
  <div class="tagline">Desarrollo web, Automatización, Soluciones Digitales</div>
</div>

<section class="contact" id="contact">
  <div class="contact-left">
    <img src="logo.png" class="contact-logo" alt="BV">
    <div class="contact-sub">Desarrollo web, Automatización, Soluciones Digitales</div>

    <h2>Contact</h2>
    <div class="contact-line"></div>

    <div class="info-item">
      <svg class="info-icon" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 4l8 8 8-8"/></svg>
      <div><small>Email</small><br><strong>pablo@binaryvision.com</strong></div>
    </div>

    <div class="info-item">
      <svg class="info-icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 5.07 9.81 19.79 0 0 1 2 1.18 2 2 0 0 1 4.03  -1.  -0h3a2 2 0 0 1 2 1.72 12.05 12.05 0 0 0 .57 2.81 2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.03 0 0 0 2.81.57A2 2 0 0 1 22 16.92z"/></svg>
      <div><small>Phone</small><br><strong><a href="https://wa.me/529912040186" style="color:inherit;text-decoration:none">+52 991 204 0186</a></strong></div>
    </div>

    <div class="info-item">
      <svg class="info-icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <div><small>Location</small><br><strong>Cansahcab, Yucatán, Mexico</strong></div>
    </div>

    <div class="info-item">
      <svg class="info-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <div><small>Business Hours</small><br><strong>Mon — Fri | 9:00 — 18:00</strong></div>
    </div>

    <a href="https://wa.me/529912040186?text=Hola%20Pablo%2C%20vi%20tu%20web%20Binary%20Vision" class="btn-msg">Send a Message</a>
  </div>

  <div class="contact-right">
    <img src="pablo-original.jpg" alt="Pablo Canché - Binary Vision">
  </div>
</section>

<script>
// Particulas sutiles elegantes como binaryvision.in
const c=document.getElementById('particles'), ctx=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();
let dots=[];
for(let i=0;i<50;i++) dots.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*0.2,vy:(Math.random()-.5)*0.2});
function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  dots.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>c.width) p.vx*=-1;
    if(p.y<0||p.y>c.height) p.vy*=-1;
    ctx.beginPath();ctx.arc(p.x,p.y,1,0,Math.PI*2);ctx.fillStyle='rgba(160,190,220,0.3)';ctx.fill();
  });
  dots.forEach((a,i)=>{
    dots.slice(i+1).forEach(b=>{
      let d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<130){ctx.strokeStyle=`rgba(160,190,220,${0.07*(1-d/130)})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
    })
  });
  requestAnimationFrame(draw);
}
draw();
window.addEventListener('resize',resize);
</script>
</body>
</html>
